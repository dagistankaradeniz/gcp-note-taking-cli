name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Build provenance attestation (below): keyless signing via the workflow's
  # OIDC identity, recorded in GitHub's attestation store.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Registered once via `POST /api/admin/oauth-clients` against the
          # prod backend (admin-only, see gcp-note-taking-backend
          # app/routers/admin.py) and stored as a repo secret -- baked into
          # every release binary so `quillink login` resolves against the
          # real prod OAuth client rather than the local-dev placeholder in
          # internal/client/oauth_client.go.
          QUILLINK_CLI_OAUTH_CLIENT_ID: ${{ secrets.QUILLINK_CLI_OAUTH_CLIENT_ID }}
          # Cross-repo push access to dagistankaradeniz/homebrew-quillink --
          # the default GITHUB_TOKEN above is scoped to this repo only.
          # See README "Distribution" for what this token can do.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Signed SLSA build provenance for every release archive and the
      # checksums file: proves an asset was built by this workflow from this
      # repo at this tag. Verify with:
      #   gh attestation verify quillink_darwin_arm64.tar.gz --repo dagistankaradeniz/gcp-note-taking-cli
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
