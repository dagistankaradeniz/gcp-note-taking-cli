name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "Run gofmt -w on the above files."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (host platform)
        run: go build ./...

      - name: Cross-compile matrix
        run: |
          mkdir -p /tmp/xcompile
          GOOS=linux   GOARCH=amd64 go build -o /tmp/xcompile/linux_amd64 .
          GOOS=linux   GOARCH=arm64 go build -o /tmp/xcompile/linux_arm64 .
          GOOS=darwin  GOARCH=amd64 go build -o /tmp/xcompile/darwin_amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o /tmp/xcompile/darwin_arm64 .
          GOOS=windows GOARCH=amd64 go build -o /tmp/xcompile/windows_amd64.exe .

  license-check:
    name: Dependency License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go install github.com/google/go-licenses@latest

      # AGPL/SSPL/GPL cannot legally be shipped in this CLI (see AGENTS.md,
      # "Open Source License & Dependency Compliance") -- fail the build if
      # one shows up in the module graph.
      - name: Fail on disallowed licenses
        run: |
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted \
            --ignore github.com/dagistankaradeniz/gcp-note-taking-cli
