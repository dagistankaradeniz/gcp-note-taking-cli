version: 2

project_name: quillink

before:
  hooks:
    - go mod tidy

builds:
  - id: quillink
    main: .
    binary: quillink
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/dagistankaradeniz/gcp-note-taking-cli/internal/client.Version={{.Version}}
      - -X github.com/dagistankaradeniz/gcp-note-taking-cli/internal/client.CLIClientID={{.Env.QUILLINK_CLI_OAUTH_CLIENT_ID}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: quillink
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: dagistankaradeniz
    name: gcp-note-taking-cli

homebrew_casks:
  - name: quillink
    repository:
      owner: dagistankaradeniz
      name: homebrew-quillink
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/dagistankaradeniz/gcp-note-taking-cli"
    description: "Command-line client for Quillink"
    binaries:
      - quillink
    # Interpolate #{version} so `brew audit` sees a versioned URL (a
    # literal tag in the URL counts as unversioned).
    url:
      template: "https://github.com/dagistankaradeniz/gcp-note-taking-cli/releases/download/v#{version}/{{ .ArtifactName }}"
    # The macOS binaries aren't signed or notarized yet, so Gatekeeper
    # would refuse to run the downloaded binary without this.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/quillink"]
          end

# The winget manifest still needs a one-time manual PR to
# microsoft/winget-pkgs -- not automatable from this repo alone. See
# README "Distribution" for the follow-up steps.
