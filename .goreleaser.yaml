version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: quillink
    main: .
    binary: quillink
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/dagistankaradeniz/gcp-note-taking-cli/internal/client.Version={{.Version}}
      - -X github.com/dagistankaradeniz/gcp-note-taking-cli/internal/client.CLIClientID={{.Env.QUILLINK_CLI_OAUTH_CLIENT_ID}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: quillink
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: dagistankaradeniz
    name: gcp-note-taking-cli

brews:
  - name: quillink
    repository:
      owner: dagistankaradeniz
      name: homebrew-quillink
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/dagistankaradeniz/gcp-note-taking-cli"
    description: "Command-line client for Quillink"
    install: |
      bin.install "quillink"
    test: |
      system "#{bin}/quillink --version"

# The winget manifest still needs a one-time manual PR to
# microsoft/winget-pkgs -- not automatable from this repo alone. See
# README "Distribution" for the follow-up steps.
